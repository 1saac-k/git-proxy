## Docker Compose for git-proxy + OpenLDAP (AD-compatible) + phpLDAPadmin
##
## Services:
##   openldap      - OpenLDAP server with AD-compatible schema (port 389)
##   phpldapadmin  - Web UI for managing LDAP users/groups (port 8088)
##   git-proxy     - Git proxy server with AD auth (ports 8000, 8081)
##   mongodb       - Database for git-proxy (port 27017)
##
## Test users (created in ldap/ldifs/02-users.ldif):
##   alice / alice123  -> admin (git-proxy-admins + git-proxy-users)
##   bob   / bob123   -> regular user (git-proxy-users only)
##   charlie / charlie123 -> no access (not in any group)
##
## Usage:
##   docker compose -f docker-compose.ad.yml up --build
##
## Access:
##   git-proxy UI:   http://localhost:8081
##   phpLDAPadmin:   http://localhost:8088
##     Login DN:     cn=admin,dc=gitproxy,dc=local
##     Password:     adminpassword
##
## Reset LDAP data (wipe users/groups and re-seed):
##   docker compose -f docker-compose.ad.yml down -v
##   docker compose -f docker-compose.ad.yml up --build

services:
  openldap:
    image: osixia/openldap:1.5.0
    command: "--copy-service"
    environment:
      LDAP_ORGANISATION: "GitProxy"
      LDAP_DOMAIN: "gitproxy.local"
      LDAP_BASE_DN: "dc=gitproxy,dc=local"
      LDAP_ADMIN_PASSWORD: "adminpassword"
      LDAP_CONFIG_PASSWORD: "configpassword"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
      LDAP_TLS: "false"
      LDAP_EXTRA_SCHEMAS: "ms"
    volumes:
      - ./ldap/schema:/container/service/slapd/assets/config/bootstrap/schema/custom:ro
      - ./ldap/ldifs:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
    ports:
      - "389:389"
    networks:
      - git-network
    healthcheck:
      test:
        [
          "CMD",
          "ldapsearch",
          "-x",
          "-H", "ldap://localhost",
          "-b", "dc=gitproxy,dc=local",
          "-D", "cn=admin,dc=gitproxy,dc=local",
          "-w", "adminpassword",
          "-s", "base"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8088:80"
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - git-network

  git-proxy:
    build: .
    ports:
      - "8000:8000"
      - "8081:8081"
    command: ["node", "--enable-source-maps", "dist/index.js", "--config", "/app/proxy.config.ad.json"]
    volumes:
      - ./proxy.config.ad.json:/app/proxy.config.ad.json:ro
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - git-network
    environment:
      - NODE_ENV=development
      - GIT_PROXY_UI_PORT=8081
      - GIT_PROXY_SERVER_PORT=8000
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/api/v1/healthcheck || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  ## mongodb is optional - only needed if using mongo sink in proxy.config.ad.json
  ## To enable: set sink.mongo.enabled=true and sink.fs.enabled=false in proxy.config.ad.json
  # mongodb:
  #   image: mongo:7
  #   ports:
  #     - "27017:27017"
  #   networks:
  #     - git-network
  #   environment:
  #     - MONGO_INITDB_DATABASE=gitproxy
  #   volumes:
  #     - mongodb_data:/data/db
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 12
  #     start_period: 5s

networks:
  git-network:
    driver: bridge

volumes:
  openldap_data:
  openldap_config:
  # mongodb_data:
